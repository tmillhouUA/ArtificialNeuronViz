<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Artificial Neuron</title>
  <!-- TEMPORARY: font trial, loaded from Google Fonts (needs internet).
       Once the font is final, embed it in the file so the page works offline. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
  <style>
    /* ---------- Page layout ---------- */
    body {
      margin: 0;
      padding: 16px;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #222;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 55px;
      /* Fixed line height, so a larger font spills into the margins instead
         of pushing the diagram down. To move the title without moving the
         diagram, shift space between the top and bottom margins (keep their
         sum at 24px). */
      line-height: 40px;
      color: #444444;
      margin: 24px 0 0;
    }

    /* The diagram scales to fit the window width, up to a maximum size. */
    #diagram {
      display: block;
      width: 100%;
      max-width: 1600px;
      height: auto;
      margin: 0 auto;
    }

    /* ---------- Diagram elements ---------- */
    /* Input squares mirror their pixel: white = 0, black ("on") = 1. */
    .input-box {
      fill: #ffffff;
      stroke: #2b7bd6;
      stroke-width: 2.5;
    }

    .input-box.on {
      fill: #111111;
    }

    /* Input value (1 or 0) shown inside each input square, in the opposite
       color to the square. Ignores the mouse so hovering reaches the square. */
    .input-value {
      font-size: 22px;
      fill: #111111;
      text-anchor: middle;        /* center horizontally on x */
      dominant-baseline: central; /* center vertically on y */
      pointer-events: none;
    }

    .input-value.on {
      fill: #ffffff;
    }

    /* ---------- Input image (3x3 one-bit pixels) ---------- */
    /* Pixel borders match the input squares' blue outline. */
    .pixel {
      fill: #ffffff;
      stroke: #2b7bd6;
      stroke-width: 2.5;
      cursor: pointer;
    }

    .pixel.on {
      fill: #111111;
    }

    /* Lines from each pixel to its input square. */
    .pixel-link {
      stroke: #bbbbbb;
      stroke-width: 1.5;
    }

    .image-frame {
      fill: none;
      stroke: #2b7bd6;
      stroke-width: 2.5;
    }

    /* stroke and stroke-width are set per line by the script, from the
       weight's value (see weightToColor and weightToStroke). */
    .weight-arrow {
      fill: none;
    }

    /* Connectors from the control panels to the neuron. */
    .weights-link,
    .activation-link {
      stroke-width: 3;
      fill: none;
    }

    .weights-link    { stroke: #2b7bd6; }
    .activation-link { stroke: #2ca25f; }

    .output-arrow {
      stroke: #2ca25f;
      stroke-width: 3;
      fill: none;
    }

    .neuron {
      stroke: #333;
      stroke-width: 2;
    }

    /* Output value box at the end of the output arrow. */
    .output-box {
      fill: #daf0e3;
      stroke: #2ca25f;
      stroke-width: 2.5;
    }

    .output-text {
      font-size: 26px;
      fill: #1d6b40;
      text-anchor: middle;        /* center horizontally on x */
      dominant-baseline: central; /* center vertically on y */
    }

    /* Panel labels: centered above the top panels and below the bottom
       ones, in the title's dark gray. */
    .panel-label {
      font-size: 18px;
      font-weight: 600;
      fill: #444444;
      text-anchor: middle;
    }

    /* "Input" and "Output" (rotated, beside the image and output box). */
    .side-label {
      font-size: 22px;  /* 1.5 x the other labels */
    }

    /* ---------- Control panels ---------- */
    /* The panel is an HTML <div> placed inside the SVG via <foreignObject>,
       so it scales along with the rest of the diagram. */
    .control-panel {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 12px;
      border-radius: 16px;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .weights-panel {
      background: #dbe9f8;
      border: 2.5px solid #2b7bd6;
    }

    .activation-panel {
      background: #daf0e3;
      border: 2.5px solid #2ca25f;
      align-items: center;
    }

    /* Each activation choice is a <button> holding a small plot and a label.
       The button's own styling is reset so only our border shows. */
    .activation-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: none;
      border: 2.5px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }

    .activation-option.selected {
      border-color: #2ca25f;
    }

    .activation-diagram .plot-background {
      fill: #ffffff;
      stroke: #9bcfb2;
      stroke-width: 1;
    }

    .activation-diagram .plot-axis {
      stroke: #999;
      stroke-width: 1;
    }

    .activation-diagram .plot-curve {
      stroke: #2ca25f;
      stroke-width: 2.5;
      fill: none;
    }

    /* Marks where the current preactivation falls on the curve. */
    .activation-diagram .plot-dot {
      fill: #d6402b;
    }

    .activation-label {
      height: 20px;
      line-height: 20px;
      font-size: 16px;
      color: #1d6b40;
    }

    .slider-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
      border-radius: 6px;
    }

    /* ---------- Mouseover highlighting ----------
       Hovering a pixel, input square, weight arrow or slider highlights all
       four for that input. Highlight color: #f5a623 (also HIGHLIGHT_COLOR in
       the script, used for the arrow halos). */
    .slider-column.highlighted {
      background: rgba(245, 166, 35, 0.45);
    }

    /* Outline drawn over a pixel or input square; ignores the mouse so clicks
       still reach the pixel underneath. */
    .highlight-outline {
      fill: none;
      stroke: #f5a623;
      stroke-width: 5;
      pointer-events: none;
    }

    /* Wider halo line drawn behind a weight arrow. */
    .arrow-halo {
      stroke: #f5a623;
      fill: none;
    }

    /* Invisible, wide line over each arrow, so thin arrows are easy to hover.
       pointer-events: stroke makes the transparent stroke still catch the mouse. */
    .arrow-hit {
      stroke: transparent;
      stroke-width: 16;
      pointer-events: stroke;
    }

    /* Vertical sliders: writing-mode turns the range input on its side, and
       direction: rtl puts the maximum at the top instead of the bottom. */
    .slider-column input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 18px;
      height: 130px;
      margin: 0;
      accent-color: #2b7bd6;
    }

    /* Fixed height so labels with and without subscripts line up. */
    .slider-label {
      height: 20px;
      line-height: 20px;
      font-size: 16px;
      color: #1b4f8a;
    }

    .slider-label sub {
      line-height: 0;
    }

    /* ---------- Buttons below the weights panel ---------- */
    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    .action-button {
      flex: 1;
      font: inherit;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      color: #ffffff;
      background: #2b7bd6;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .action-button:hover {
      background: #1f66b8;
    }

    /* ---------- Math panel ----------
       Two parts side by side:
         left:  the preactivation as column addition (grid), at the bottom
         right: the activation function, after a green divider, centered
                vertically */
    /* The panel is only as wide as its contents (fit-content), pushed to the
       right edge of its foreignObject (margin-left: auto), so its right edge
       still lines up with the output box. Its parts have fixed widths (below),
       so the panel doesn't change width as the numbers change. */
    .math-panel {
      box-sizing: border-box;
      width: fit-content;
      margin-left: auto;
      height: 100%;
      padding: 8px 14px;
      border-radius: 16px;
      background: #f1f1f1;
      border: 2.5px solid #7a7a7a;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 17.5px;
      line-height: 22px;
      color: #1b4f8a;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      font-variant-numeric: tabular-nums;  /* equal-width digits line up */
      position: relative;  /* so the curve overlay can be placed over it */
    }

    /* SVG laid over the whole panel (inside its border) for the curve that
       connects the weighted sum to the activation formula. Positioned
       absolutely, so it doesn't affect the panel's layout, and ignores the
       mouse so hovering still reaches the table underneath. */
    .math-link-overlay {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    /* Dotted, half-opacity line whose dots march from the weighted sum toward
       the activation formula.
         - stroke-dasharray "0 6" draws zero-length dashes every 6px; with
           round line caps, each zero-length dash shows as a round dot.
         - The animation shifts the pattern along the line by one full
           repeat (6px) per cycle, so the loop is seamless. A negative offset
           moves the dots forward, from the path's start toward its end. */
    .math-link {
      fill: none;
      stroke: #555555;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 0 6;
      opacity: 0.5;
      animation: math-link-march 0.6s linear infinite;
    }

    @keyframes math-link-march {
      to { stroke-dashoffset: -6; }
    }

    /* Respect the viewer's "reduce motion" setting: keep the dots, stop the
       marching. */
    @media (prefers-reduced-motion: reduce) {
      .math-link { animation: none; }
    }

    /* Activation function part: name, formula, then f(z) = result. Stretches
       to the full panel height so its divider runs top to bottom; content is
       centered vertically. */
    .activation-math {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 14px;  /* 12px + the 2px a border used to take */
      color: #1d6b40;
      text-align: center;
      white-space: nowrap;
      width: 8.5em; /* fits the widest formula, e.g. "1 / (1 + e^18.00)" */
      position: relative;  /* so the divider lines can be placed on its edge */
    }

    /* The divider: two parallel 2px lines, 5px apart, blue then green
       (preactivation | activation). The pair (9px wide) is centered 1px
       inside the section's left edge: -3.5px to -1.5px, then 3.5px to
       5.5px. Absolutely positioned, so they don't affect layout. */
    .activation-math::before,
    .activation-math::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
    }

    .activation-math::before {
      left: -3.5px;
      background: #2b7bd6;
    }

    .activation-math::after {
      left: 3.5px;
      background: #2ca25f;
    }

    /* The weighted sum (z) is blue in both places it appears: as the total
       of the addition table and inside the activation formula. The one in
       the formula is bold (700); the total is semibold (600, via
       .math-total). */
    .math-total .math-value,
    .act-z {
      color: #2b7bd6;
    }

    .act-z {
      font-weight: 700;
    }

    /* The space below the name holds the connecting line's top run. */
    .act-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .act-value {
      font-size: 22px;
      line-height: 28px;
      font-weight: 600;
    }

    /* Preactivation part: a grid with six columns, in order:
         row number | x | "×" | w | "=" | product
       Rows: header, one per input, then the sum row
         "weighted sum" (spans columns 1-4) | "=" | total

       SPACING. Every horizontal gap comes from just two settings:
         --op-gap     space on EACH side of "×" and "="
         --index-gap  space between the row number and x
       There is no other padding and no fixed column width, so no hidden
       leftover space. This works because every value has a constant width:
         - x is always one digit;
         - weights and products are drawn with an invisible minus sign when
           positive (class math-pad), so "−2.0" and " 1.3" are equally wide
           and their decimal points line up. (So a positive value shows a
           blank where its minus sign would be.)
         - the total is drawn with invisible characters AFTER it, so it
           always starts right after its "=", but its width stays constant
           and the panel doesn't change size as it changes.
       The row number column is flexible (1fr): if "weighted sum" is wider
       than columns 1-4, the extra width becomes indent on the far left
       instead of stretching the other gaps. */
    .math-grid {
      --op-gap: 8px;
      --index-gap: 14px;
      display: grid;
      grid-template-columns: 1fr auto auto auto auto auto;
    }

    .math-cell,
    .math-head {
      padding: 1px 0;
      text-align: right;
    }

    .math-head {
      padding-bottom: 2px;
    }

    .math-index {
      color: #7f9cc0;   /* muted, so the numbers read as row labels */
      padding-right: var(--index-gap);
    }

    .math-op {
      text-align: center;
      padding: 1px var(--op-gap);
    }

    /* Products (and their header) start right after "="; their constant
       width keeps the decimal points lined up. */
    .math-product {
      text-align: left;
    }

    /* Invisible placeholder characters that keep values a constant width. */
    .math-pad {
      visibility: hidden;
    }

    /* Round only the outer ends of a highlighted row's band. */
    .math-cell.highlighted {
      background: rgba(245, 166, 35, 0.45);
    }
    .math-index.highlighted {
      border-radius: 4px 0 0 4px;
    }
    .math-product.highlighted {
      border-radius: 0 4px 4px 0;
    }

    /* Sum row: line above; larger than the rows above, since the sum matters
       more than the trace. Its "=" uses the same column (and gaps) as the
       rows' "=", so they line up exactly. */
    .math-sum-label,
    .math-sum-op,
    .math-total {
      border-top: 1.5px solid #1b4f8a;
      margin-top: 3px;
      padding-top: 3px;
      font-size: 22px;
      line-height: 28px;
      white-space: nowrap;
    }

    .math-sum-label {
      grid-column: 1 / 5;
      text-align: right;
    }

    .math-sum-op {
      text-align: center;
      padding-left: var(--op-gap);
      padding-right: var(--op-gap);
    }

    .math-total {
      font-weight: 600;
      text-align: left;
    }

    /* ---------- Learning panel ----------
       Upper right. Shows how one image would change the weights:
         Δw = learning rate × error × input
       Two parts side by side, then a bottom row:
         left:   a table like the preactivation's, one row per input:
                   i   x  ×  (rate × error)  =  Δw
         right:  after a gray divider, the target, the learning rate, and
                 the error and rate × error worked out
         bottom: the rule in words, and the Learn button
       Styled like the math panel. */
    .learn-panel {
      box-sizing: border-box;
      height: 100%;
      padding: 8px 14px;
      border-radius: 16px;
      background: #f1f1f1;
      border: 2.5px solid #7a7a7a;
      font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 19px;
      color: #333333;
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .learn-body {
      display: flex;
      gap: 14px;
    }

    .learn-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .learn-row.spread {
      justify-content: space-between;
    }

    .learn-label {
      font-weight: 600;
    }

    /* Left: the per-input table. Six columns:
         row number | x | "×" | rate × error | "=" | Δw */
    .learn-grid {
      display: grid;
      grid-template-columns: repeat(6, auto);
      align-content: start;
      flex: none;           /* keep its natural width; the side column flexes */
      white-space: nowrap;
    }

    .learn-grid > div {
      text-align: right;
    }

    .learn-grid .learn-index {
      color: #9a9a9a;
      padding-right: 12px;
    }

    /* Extra space between the x column and the "×" column. */
    .learn-grid .learn-x {
      padding-right: 12px;
    }

    .learn-grid .learn-op {
      text-align: center;
      padding: 0 11px;
    }

    .learn-grid .learn-head {
      padding-bottom: 2px;
    }

    /* "rate × error" header: spans the "×" column and the one after it.
       Zero width, so it doesn't widen those columns (its text simply
       overflows to the right). margin-left nudges it right. */
    .learn-grid .learn-factor-head {
      grid-column: 3 / 5;
      width: 0;
      text-align: left;
      margin-left: 16px;
    }

    /* Round only the outer ends of a highlighted row's band. */
    .learn-grid .highlighted {
      background: rgba(245, 166, 35, 0.45);
    }
    .learn-grid .learn-index.highlighted {
      border-radius: 4px 0 0 4px;
    }
    .learn-grid .learn-delta.highlighted {
      border-radius: 0 4px 4px 0;
    }

    /* Right: target, learning rate and error, after a divider. */
    .learn-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 14px;
      border-left: 2px solid #b5b5b5;
      white-space: nowrap;
    }

    /* Continuation lines of a worked calculation ("= 1 − 0.09"), indented
       under the first line. */
    .learn-step {
      padding-left: 1.5em;
    }

    /* Target choice (X vs O task): two small toggle buttons. */
    .target-option {
      font: inherit;
      width: 32px;
      height: 26px;
      padding: 0;
      background: #ffffff;
      color: #333333;
      border: 2px solid #7a7a7a;
      border-radius: 8px;
      cursor: pointer;
    }

    .target-option.selected {
      background: #333333;
      color: #ffffff;
      border-color: #333333;
    }

    .learn-rate-slider {
      margin: 0;
      accent-color: #7a7a7a;
    }

    .learn-button {
      font: inherit;
      font-size: 16px;
      padding: 4px 16px;
      color: #ffffff;
      background: #555555;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .learn-button:hover {
      background: #333333;
    }

    /* Ghost thumb on each weight slider: a dashed circle where the slider
       would move if the Learn button were pressed. Ignores the mouse.
       Hidden unless the weights panel has the "show-ghosts" class, which is
       on while the mouse is over the learning panel. */
    .slider-column {
      position: relative;
    }

    .ghost-thumb {
      display: none;
      position: absolute;
      left: 50%;
      width: 14px;
      height: 14px;
      margin-left: -9px;
      margin-top: -9px;
      border: 2px dashed #333333;
      border-radius: 50%;
      opacity: 0.6;
      pointer-events: none;
    }

    .show-ghosts .ghost-thumb {
      display: block;
    }
  </style>
</head>
<body>

  <h1>The Artificial Neuron</h1>

  <!--
    The diagram is drawn in a fixed 1600 x 800 coordinate system (the viewBox).
    The browser scales that coordinate system to whatever size the SVG is
    displayed at, so all positions below are in these "diagram units."
  -->
  <svg id="diagram" viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Horizontal gradient for the neuron body: blue (left) to green (right). -->
      <linearGradient id="neuronGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#2b7bd6" />
        <stop offset="100%" stop-color="#2ca25f" />
      </linearGradient>

      <!--
        Arrowheads. refX="3" places the end of the line 3 units inside the
        triangle, so the shaft stops just inside the head (see ARROW_TIP_OFFSET).
        The output arrow's marker uses the default markerUnits="strokeWidth":
        5 x stroke-width 3 = 15 x 15 diagram units. The weight arrows each get
        their own marker, created by the script (so each head can match its
        line's color), sized at a fixed 15 x 15 so heads don't grow with the
        line's thickness.
      -->
      <marker id="arrowGreen" viewBox="0 0 10 10" refX="3" refY="5"
              markerWidth="5" markerHeight="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#2ca25f" />
      </marker>
    </defs>

    <!--
      Layers, drawn in order (later groups appear on top). They sit inside a
      "content" group that the script shifts to center the neuron.
    -->
    <g id="content">
      <g id="pixelLinksLayer"></g>
      <g id="haloLayer"></g>
      <g id="weightsLayer"></g>
      <g id="arrowHitLayer"></g>
      <g id="linksLayer"></g>
      <g id="inputsLayer"></g>
      <g id="imageLayer"></g>
      <g id="highlightLayer"></g>
      <g id="outputLayer"></g>
      <g id="neuronLayer"></g>
      <g id="panelsLayer"></g>
    </g>
  </svg>

  <script>
    // ---------- Layout constants (diagram units) ----------
    // The neuron is centered in the viewBox at the end of the script, so these
    // positions only matter relative to each other (e.g. the gap between
    // INPUT_X and NEURON_X), not as absolute coordinates.
    const NEURON_X = 470;       // center of the neuron
    const NEURON_Y = 350;
    const NEURON_R = 70;        // radius of the neuron

    const NUM_INPUTS    = 9;
    const INPUT_X       = 25;  // center x of the input column
    const INPUT_SPACING = 75; // vertical distance between input centers
    const BOX_SIZE      = 44;   // width/height of each input square
    const BOX_RADIUS    = 0;    // corner rounding of the squares (0 = sharp)

    const OUTPUT_LENGTH = 375;  // length of the output arrow (to its tip)
    const OUTPUT_BOX_W  = 220;  // output value box, placed at the arrow's tip
    const OUTPUT_BOX_H  = 96;   // tall enough for two lines (X vs O task)
    const OUTPUT_BOX_RADIUS = 10;
    const OUTPUT_LINE_GAP   = 36;  // distance between the two text lines

    // How far an arrowhead's tip extends past the end of its line. The markers
    // use refX="3", so the tip sits 7 marker units past the line's end; each
    // marker unit is (15 diagram units of marker size) / viewBox width 10 = 1.5
    // diagram units. Lines are shortened by this amount so the tip lands where
    // the line would have ended, while the shaft stops just inside the head.
    // If you change the marker sizes (or the output arrow's stroke width),
    // update this value.
    const ARROW_TIP_OFFSET = 7 * 1.5;

    // Control panels: weights panel centered below the neuron, activation
    // panel centered above it. Both share these dimensions. Vertically, the
    // weights panel's bottom lines up with the bottom input square's bottom,
    // and the activation panel's top with the top input square's top.
    const SLIDER_COLUMN_W = 30;   // horizontal space per slider
    const PANEL_PADDING   = 12;   // matches .control-panel padding in the CSS
    const PANEL_W = NUM_INPUTS * SLIDER_COLUMN_W + 2 * PANEL_PADDING;
    const PANEL_H = 180;

    // Slider range and the mapping from weight to line thickness.
    const W_MAX      = 2;     // sliders run from -W_MAX to +W_MAX
    const W_STEP     = 0.01;
    const MIN_STROKE = 0.5;   // line thickness when the weight is 0
    const MAX_STROKE = 8;     // line thickness when |weight| = W_MAX

    // Weight colors, as [r, g, b]: a straight blend from red (-W_MAX) to
    // blue (+W_MAX), passing through purple at 0. (Magnitude is already shown
    // by line thickness, so color only needs to show direction.)
    const POSITIVE_COLOR = [43, 123, 214];   // #2b7bd6
    const NEGATIVE_COLOR = [214, 64, 43];    // #d6402b

    // Input image: a 3x3 grid of one-bit pixels to the left of the input
    // column, centered on the neuron. Each pixel is the same size as an
    // input square.
    // Pixels are numbered in row-major order (left to right, top to bottom).
    // PIXEL_TO_INPUT[p] is the input square (0 = top) that pixel p feeds. The
    // bottom row is reversed so the gray pixel-to-input lines don't cross.
    const PIXEL_TO_INPUT = [
      0, 1, 2,
      3, 4, 5,
      8, 7, 6,
    ];
    // The reverse lookup: INPUT_TO_PIXEL[i] is the pixel feeding input square i.
    const INPUT_TO_PIXEL = [];
    PIXEL_TO_INPUT.forEach((i, p) => { INPUT_TO_PIXEL[i] = p; });
    const IMAGE_ROWS = 3;
    const IMAGE_COLS = 3;
    const IMAGE_SIZE = IMAGE_COLS * BOX_SIZE;  // width/height of the whole grid
    const IMAGE_GAP  = 100;       // horizontal gap between grid and input column

    // Range of possible preactivations: every pixel black, every weight at
    // +W_MAX (or -W_MAX). With no bias, that's -9 to +9.
    const Z_MAX = NUM_INPUTS * W_MAX;
    const Z_MIN = -Z_MAX;

    // Activation choices shown in the activation panel. Both are plotted over
    // the full preactivation range (x); each has its own output range (y).
    // applied(zText) returns the formula (HTML) with the weighted sum filled
    // in, shown in the math panel.
    const ACTIVATIONS = [
      { id: "sigmoid", label: "Sigmoid", f: x => 1 / (1 + Math.exp(-x)), yMin: 0, yMax: 1,
        // e^-z; for a negative z the two minus signs cancel, e.g. e^1.80.
        // The value is wrapped in an "act-z" span so the connecting line in
        // the math panel can find it.
        applied: zText => `1 / (1 + <i>e</i><sup><span class="act-z">${zText.startsWith("−") ? zText.slice(1) : "−" + zText}</span></sup>)` },
      { id: "relu",    label: "ReLU",    f: x => Math.max(0, x),          yMin: 0, yMax: Z_MAX,
        applied: zText => `max(0, <span class="act-z">${zText}</span>)` },
    ];
    const PLOT_Y_PAD   = 0.1;  // extra space above/below the y range, as a fraction of it
    const PLOT_SIZE    = 100;  // width/height of each activation plot
    const PLOT_MARGIN  = 8;    // space between the plot's edge and its curve
    const PLOT_SAMPLES = 60;   // points used to draw each curve (even, so x = 0 is hit)

    // Training. Full-batch gradient descent on a fixed training set; one
    // update per animation frame (~60 per second). Two tasks:
    //   xo:    tell noisy Xs (output 1) from noisy Os (output 0), using sigmoid
    //          and cross-entropy loss.
    //   count: output the number of black pixels in a random black/white
    //          image, using ReLU and squared-error loss.
    const TASKS = {
      xo:    { label: "X vs O",   activation: "sigmoid", learningRate: 0.3 },
      count: { label: "Counting", activation: "relu",    learningRate: 0.05 },
    };
    const TRAIN_SET_SIZE = 200;  // images in the training set (either task)

    // X vs O task data.
    const BASE_X = [   // row-major pixel order, 1 = black
      1, 0, 1,
      0, 1, 0,
      1, 0, 1,
    ];
    const BASE_O = [
      1, 1, 1,
      1, 0, 1,
      1, 1, 1,
    ];
    const TARGET_X       = 1;    // desired output for an X
    const TARGET_O       = 0;    // desired output for an O
    const NOISE_SD       = 0.35; // standard deviation of per-pixel noise

    // Counting task data: each pixel is black with this probability.
    const COUNT_BLACK_PROB = 0.5;

    // General-interest logging (training loss). Set true to enable.
    const verbose = false;

    const SVG_NS = "http://www.w3.org/2000/svg";

    // ---------- Model state ----------
    // Input values, one per pixel in row-major (image) order: 1 = black,
    // 0 = white. Default: a plus sign. Note that weights are indexed by input
    // square, so pixel p pairs with weights[PIXEL_TO_INPUT[p]].
    const inputs = [
      0, 1, 0,
      1, 1, 1,
      0, 1, 0,
    ];
    // Weights start at 0 here; initializeWeights() randomizes them on load.
    const weights = new Array(NUM_INPUTS).fill(0);
    let activation = "sigmoid";  // id of the selected activation function

    // Training set: array of { pixels, target }, made by generateTrainingSet().
    let trainingSet = [];
    let isTraining  = false;
    let task = "xo";  // key into TASKS
    let trainStepCount = 0;
    // Learning rate used by both Train and the learning panel's Learn button;
    // set by the learning panel's slider and reset to the task's default when
    // the task changes.
    let learningRate = TASKS[task].learningRate;
    // Target for the image on screen in the X vs O task (picked in the
    // learning panel). In the counting task the target is simply the image's
    // black-pixel count.
    let xoTarget = TARGET_X;

    // ---------- Neuron math ----------
    // Preactivation: z = sum over pixels of (weight x input). There is no
    // bias term: a deliberate simplification for a lay audience.
    // Weights are indexed by input square, so look each pixel's up via
    // PIXEL_TO_INPUT. Uses the drawn image unless another pixel array is given.
    function computePreactivation(pixels = inputs) {
      let z = 0;
      for (let p = 0; p < NUM_INPUTS; p++) {
        z += weights[PIXEL_TO_INPUT[p]] * pixels[p];
      }
      return z;
    }

    // Output: the selected activation function applied to the preactivation.
    function computeOutput() {
      const act = ACTIVATIONS.find(a => a.id === activation);
      return act.f(computePreactivation());
    }

    // Line thickness grows with the weight's magnitude; the sign is ignored.
    function weightToStroke(w) {
      return MIN_STROKE + (Math.abs(w) / W_MAX) * (MAX_STROKE - MIN_STROKE);
    }

    // Line color: blend from red (w = -W_MAX) to blue (w = +W_MAX).
    function weightToColor(w) {
      const t = (w / W_MAX + 1) / 2;  // 0 at -W_MAX, 1 at +W_MAX
      const rgb = NEGATIVE_COLOR.map((c, j) =>
        Math.round(c + (POSITIVE_COLOR[j] - c) * t));
      return `rgb(${rgb.join(", ")})`;
    }

    // Apply weight i's thickness and color to its arrow, arrowhead and slider.
    function updateWeightDisplay(i) {
      const color = weightToColor(weights[i]);
      weightLines[i].style.strokeWidth = weightToStroke(weights[i]);
      weightLines[i].style.stroke = color;
      weightArrowHeads[i].setAttribute("fill", color);
      weightSliders[i].style.accentColor = color;
      haloLines[i].style.strokeWidth = weightToStroke(weights[i]) + 2 * HALO_EXTRA;
    }

    // Show or hide the highlight for input i: its pixel and input-square
    // outlines, its arrow halo, and its slider column background.
    function setHighlight(i, on) {
      const display = on ? "" : "none";
      for (const outline of highlightOutlines[i]) outline.style.display = display;
      haloLines[i].style.display = display;
      sliderColumns[i].classList.toggle("highlighted", on);
      for (const cell of mathCells[i]) cell.classList.toggle("highlighted", on);
      for (const cell of learnCells[i]) cell.classList.toggle("highlighted", on);
    }

    // Make an element highlight input i while the mouse is over it.
    function addHoverHighlight(el, i) {
      el.addEventListener("mouseenter", () => setHighlight(i, true));
      el.addEventListener("mouseleave", () => setHighlight(i, false));
    }

    // Helper: create an SVG element with a set of attributes.
    function makeSvg(tag, attrs) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const [key, value] of Object.entries(attrs)) {
        el.setAttribute(key, value);
      }
      return el;
    }

    const weightsLayer = document.getElementById("weightsLayer");
    const inputsLayer  = document.getElementById("inputsLayer");
    const neuronLayer  = document.getElementById("neuronLayer");
    const outputLayer  = document.getElementById("outputLayer");
    const panelsLayer  = document.getElementById("panelsLayer");
    const linksLayer   = document.getElementById("linksLayer");
    const imageLayer   = document.getElementById("imageLayer");
    const pixelLinksLayer = document.getElementById("pixelLinksLayer");
    const haloLayer       = document.getElementById("haloLayer");
    const arrowHitLayer   = document.getElementById("arrowHitLayer");
    const highlightLayer  = document.getElementById("highlightLayer");

    // Weight arrows, their arrowheads and their sliders, kept so a weight
    // change can update all three (see updateWeightDisplay).
    const weightLines      = [];
    const weightArrowHeads = [];
    const weightSliders    = [];
    const defs = document.querySelector("#diagram defs");

    // Highlight elements, indexed by input square (see setHighlight).
    const HIGHLIGHT_COLOR = "#f5a623";
    const HALO_EXTRA = 3;          // how far the halo extends beyond the arrow
    const haloLines = [];          // halo line behind each arrow
    const highlightOutlines = [];  // [pixel outline, input-square outline] per input
    const sliderColumns = [];      // slider + label container per weight
    const learnCells = [];         // [x cell, Δw cell] per input in the learning panel
    for (let i = 0; i < NUM_INPUTS; i++) highlightOutlines.push([]);
    const ghostThumbs = [];        // ghost thumb on each weight slider

    // Shared arrowhead for the halos: a copy of a weight arrow's 15 x 15 head,
    // enlarged so it sticks out by HALO_EXTRA evenly on all three sides. A
    // triangle grown evenly on all sides is the same triangle scaled about
    // its incenter (the point equally far from all three sides), so:
    //   r     = the head's inradius = area / half-perimeter
    //   scale = (r + HALO_EXTRA) / r
    // and the halo is positioned so both heads share that incenter.
    // Distances below are in diagram units, measured along the arrow from the
    // end of the line (the regular head's base is 3 marker units x 1.5 behind it).
    const HEAD_SIZE   = 15;
    const headSlant   = Math.hypot(HEAD_SIZE, HEAD_SIZE / 2);
    const headInradius = (HEAD_SIZE * HEAD_SIZE / 2) / ((HEAD_SIZE + 2 * headSlant) / 2);
    const headBase    = -3 * (HEAD_SIZE / 10);           // regular head's base
    const headCenter  = headBase + headInradius;          // incenter position
    const haloSize    = HEAD_SIZE * (headInradius + HALO_EXTRA) / headInradius;
    const haloScale   = haloSize / 10;                    // diagram units per marker unit
    const haloBase    = headCenter - (headInradius + HALO_EXTRA);
    const haloMarker = makeSvg("marker", {
      id: "arrowHalo",
      viewBox: "0 0 10 10",
      refX: -haloBase / haloScale,  // puts the halo's base at haloBase
      refY: 5,
      markerUnits: "userSpaceOnUse",
      markerWidth: 10 * haloScale, markerHeight: 10 * haloScale,
      orient: "auto",
    });
    haloMarker.appendChild(makeSvg("path", { d: "M0,0 L10,5 L0,10 z", fill: HIGHLIGHT_COLOR }));
    defs.appendChild(haloMarker);

    // Input squares and pixels, kept so clicks can update their colors.
    const inputBoxes = [];
    const inputTexts = [];  // value label inside each input square
    const pixelRects = [];

    // ---------- Inputs and weight arrows ----------
    // The input column is centered vertically on the neuron. Its nominal top
    // and bottom edges are what the panels line up with (activation and
    // learning panels at the top, weights panel at the bottom).
    const inputColumnTop    = NEURON_Y - INPUT_SPACING * (NUM_INPUTS - 1) / 2 - BOX_SIZE / 2;
    const inputColumnBottom = NEURON_Y + INPUT_SPACING * (NUM_INPUTS - 1) / 2 + BOX_SIZE / 2;

    // An SVG outline is centered on the shape's edge, so half of it sticks
    // out past the square, while the HTML panels draw their borders inside
    // their edges. The top square is moved down by half its outline so its
    // outer edge meets the top panels' outer edges; the bottom square stays
    // put, and the squares between are spaced evenly.
    const INPUT_STROKE = 2.5;  // matches .input-box stroke-width in the CSS
    const inputTop    = inputColumnTop + INPUT_STROKE / 2 + BOX_SIZE / 2;  // top square's center
    const inputBottom = inputColumnBottom - BOX_SIZE / 2;                  // bottom square's center
    const inputStep   = (inputBottom - inputTop) / (NUM_INPUTS - 1);       // center-to-center

    for (let i = 0; i < NUM_INPUTS; i++) {
      const cy = inputTop + i * inputStep;

      // Input square, centered at (INPUT_X, cy).
      const box = makeSvg("rect", {
        class: "input-box",
        x: INPUT_X - BOX_SIZE / 2,
        y: cy - BOX_SIZE / 2,
        width: BOX_SIZE,
        height: BOX_SIZE,
        rx: BOX_RADIUS,
      });
      inputsLayer.appendChild(box);
      inputBoxes.push(box);
      addHoverHighlight(box, i);

      // Value label (text set by updateInputDisplay). dy nudges it up: digits
      // have no descenders, so "central" alone leaves them looking low.
      const valueText = makeSvg("text", {
        class: "input-value",
        x: INPUT_X,
        y: cy,
        dy: "-0.08em",
      });
      inputsLayer.appendChild(valueText);
      inputTexts.push(valueText);

      // Highlight outline for this input square (hidden until hovered).
      const boxOutline = makeSvg("rect", {
        class: "highlight-outline",
        x: INPUT_X - BOX_SIZE / 2,
        y: cy - BOX_SIZE / 2,
        width: BOX_SIZE,
        height: BOX_SIZE,
        rx: BOX_RADIUS,
      });
      boxOutline.style.display = "none";
      highlightLayer.appendChild(boxOutline);
      highlightOutlines[i].push(boxOutline);

      // Weight arrow: starts at the right edge of the square and points at the
      // neuron's center. The line stops ARROW_TIP_OFFSET short of the neuron's
      // edge so the arrowhead's tip touches the edge.
      const startX = INPUT_X + BOX_SIZE / 2;
      const startY = cy;
      const dx = NEURON_X - startX;
      const dy = NEURON_Y - startY;
      const dist = Math.hypot(dx, dy);
      const endX = NEURON_X - (dx / dist) * (NEURON_R + ARROW_TIP_OFFSET);
      const endY = NEURON_Y - (dy / dist) * (NEURON_R + ARROW_TIP_OFFSET);

      // This arrow's own arrowhead marker, so its color can follow the weight.
      // markerUnits="userSpaceOnUse" fixes its size at 15 x 15 diagram units.
      const marker = makeSvg("marker", {
        id: `arrowWeight${i}`,
        viewBox: "0 0 10 10",
        refX: 3, refY: 5,
        markerUnits: "userSpaceOnUse",
        markerWidth: 15, markerHeight: 15,
        orient: "auto",
      });
      const head = makeSvg("path", { d: "M0,0 L10,5 L0,10 z" });
      marker.appendChild(head);
      defs.appendChild(marker);
      weightArrowHeads.push(head);

      const line = makeSvg("line", {
        class: "weight-arrow",
        x1: startX, y1: startY,
        x2: endX,   y2: endY,
        "marker-end": `url(#arrowWeight${i})`,
      });
      weightsLayer.appendChild(line);
      weightLines.push(line);

      // Halo: same line in the highlight color, HALO_EXTRA wider on each side
      // (width kept in sync by updateWeightDisplay), with a larger arrowhead.
      // Lives in a layer behind all arrows; hidden until hovered.
      const halo = makeSvg("line", {
        class: "arrow-halo",
        x1: startX, y1: startY,
        x2: endX,   y2: endY,
        "marker-end": "url(#arrowHalo)",
      });
      halo.style.display = "none";
      haloLayer.appendChild(halo);
      haloLines.push(halo);

      // Invisible wide line on top of the arrow to catch the mouse.
      const hit = makeSvg("line", {
        class: "arrow-hit",
        x1: startX, y1: startY,
        x2: endX,   y2: endY,
      });
      arrowHitLayer.appendChild(hit);
      addHoverHighlight(hit, i);
    }

    // ---------- Input image ----------
    // A 3x3 grid of clickable pixels. Clicking a pixel toggles it between
    // black (1) and white (0); its input square changes to match.
    const imageRight = INPUT_X - BOX_SIZE / 2 - IMAGE_GAP;
    const imageLeft  = imageRight - IMAGE_SIZE;
    const imageTop   = NEURON_Y - IMAGE_SIZE / 2;
    const pixelW     = IMAGE_SIZE / IMAGE_COLS;
    const pixelH     = IMAGE_SIZE / IMAGE_ROWS;

    for (let p = 0; p < NUM_INPUTS; p++) {
      const row = Math.floor(p / IMAGE_COLS);
      const col = p % IMAGE_COLS;

      const pixel = makeSvg("rect", {
        class: "pixel",
        x: imageLeft + col * pixelW,
        y: imageTop + row * pixelH,
        width: pixelW,
        height: pixelH,
      });

      pixel.addEventListener("click", () => {
        inputs[p] = 1 - inputs[p];  // toggle 0 <-> 1
        updateInputDisplay();
        updateOutput();
      });

      imageLayer.appendChild(pixel);
      pixelRects.push(pixel);
      addHoverHighlight(pixel, PIXEL_TO_INPUT[p]);

      // Highlight outline for this pixel (hidden until hovered).
      const pixelOutline = makeSvg("rect", {
        class: "highlight-outline",
        x: imageLeft + col * pixelW,
        y: imageTop + row * pixelH,
        width: pixelW,
        height: pixelH,
      });
      pixelOutline.style.display = "none";
      highlightLayer.appendChild(pixelOutline);
      highlightOutlines[PIXEL_TO_INPUT[p]].push(pixelOutline);

      // Light gray line from this pixel's center to its input square's center.
      // Drawn in a layer behind both, so only the part between them shows.
      pixelLinksLayer.appendChild(makeSvg("line", {
        class: "pixel-link",
        x1: imageLeft + (col + 0.5) * pixelW,
        y1: imageTop + (row + 0.5) * pixelH,
        x2: INPUT_X,
        y2: inputTop + PIXEL_TO_INPUT[p] * inputStep,
      }));
    }

    // Outer frame drawn over the pixels.
    imageLayer.appendChild(makeSvg("rect", {
      class: "image-frame",
      x: imageLeft,
      y: imageTop,
      width: IMAGE_SIZE,
      height: IMAGE_SIZE,
    }));

    // Color each pixel and its input square from the current input values,
    // and show the value (1 or 0) inside the square.
    function updateInputDisplay() {
      for (let p = 0; p < NUM_INPUTS; p++) {
        const i = PIXEL_TO_INPUT[p];
        const isOn = (inputs[p] === 1);
        pixelRects[p].classList.toggle("on", isOn);
        inputBoxes[i].classList.toggle("on", isOn);
        inputTexts[i].classList.toggle("on", isOn);
        inputTexts[i].textContent = inputs[p];
      }
    }

    updateInputDisplay();

    // ---------- Neuron ----------
    neuronLayer.appendChild(makeSvg("circle", {
      class: "neuron",
      cx: NEURON_X,
      cy: NEURON_Y,
      r: NEURON_R,
      fill: "url(#neuronGradient)",
    }));

    // ---------- Output arrow ----------
    outputLayer.appendChild(makeSvg("line", {
      class: "output-arrow",
      x1: NEURON_X + NEURON_R,
      y1: NEURON_Y,
      x2: NEURON_X + NEURON_R + OUTPUT_LENGTH - ARROW_TIP_OFFSET,
      y2: NEURON_Y,
      "marker-end": "url(#arrowGreen)",
    }));

    // ---------- Output box ----------
    // Rounded box whose left edge sits at the output arrow's tip, showing the
    // neuron's output value.
    const outputBoxLeft = NEURON_X + NEURON_R + OUTPUT_LENGTH;

    outputLayer.appendChild(makeSvg("rect", {
      class: "output-box",
      x: outputBoxLeft,
      y: NEURON_Y - OUTPUT_BOX_H / 2,
      width: OUTPUT_BOX_W,
      height: OUTPUT_BOX_H,
      rx: OUTPUT_BOX_RADIUS,
    }));

    // Two text lines. The X vs O task uses both; counting uses only the first,
    // moved to the box's vertical center (see updateOutput).
    const outputLines = [0, 1].map(() => {
      const line = makeSvg("text", {
        class: "output-text",
        x: outputBoxLeft + OUTPUT_BOX_W / 2,
      });
      outputLayer.appendChild(line);
      return line;
    });

    // Format a probability as "= 0.94", or "≈ 1.00" / "≈ 0.00" when rounding
    // hides that sigmoid never actually reaches 0 or 1.
    function formatProbability(p) {
      const text = p.toFixed(2);
      return (text === "0.00" || text === "1.00") ? `≈ ${text}` : `= ${text}`;
    }

    // Recompute the output and show it in a task-specific form, rounded to two
    // decimal places:
    //   xo:    "P(X) = y" and "P(O) = 1 - y" on two lines.
    //   count: "Count = y" on one line.
    // If the selected activation isn't the task's own, the labels would be
    // misleading, so just the bare number is shown.
    // Also moves the red dot on the selected activation plot and refreshes the
    // math panel.
    function updateOutput() {
      updateActivationDots(computePreactivation());
      updateMathPanel();
      const y = computeOutput();

      updateLearnPanel();

      if (activation !== TASKS[task].activation) {
        outputLines[0].textContent = y.toFixed(2);
        outputLines[1].textContent = "";
        outputLines[0].setAttribute("y", NEURON_Y);
      } else if (task === "xo") {
        outputLines[0].textContent = `P(X) ${formatProbability(y)}`;
        outputLines[1].textContent = `P(O) ${formatProbability(1 - y)}`;
        outputLines[0].setAttribute("y", NEURON_Y - OUTPUT_LINE_GAP / 2);
        outputLines[1].setAttribute("y", NEURON_Y + OUTPUT_LINE_GAP / 2);
      } else {
        outputLines[0].textContent = `Count = ${y.toFixed(2)}`;
        outputLines[1].textContent = "";
        outputLines[0].setAttribute("y", NEURON_Y);
      }
    }

    // ---------- Weights panel ----------
    // An HTML panel inside a <foreignObject>, with one vertical slider per
    // weight.
    // Bottom aligned with the bottom of the last input square.
    const panelTop = inputColumnBottom - PANEL_H;

    const panelObject = makeSvg("foreignObject", {
      x: NEURON_X - PANEL_W / 2,
      y: panelTop,
      width: PANEL_W,
      height: PANEL_H,
    });

    const weightsPanel = document.createElement("div");
    weightsPanel.className = "control-panel weights-panel";

    for (let i = 0; i < NUM_INPUTS; i++) {
      const column = document.createElement("div");
      column.className = "slider-column";

      const slider = document.createElement("input");
      slider.type  = "range";
      slider.min   = -W_MAX;
      slider.max   = W_MAX;
      slider.step  = W_STEP;
      slider.value = weights[i];

      const label = document.createElement("div");
      label.className = "slider-label";
      label.innerHTML = `<i>w</i><sub>${i + 1}</sub>`;

      // Update the model (and the arrow/slider styling) as the slider moves.
      slider.addEventListener("input", () => {
        weights[i] = Number(slider.value);
        updateWeightDisplay(i);
        updateOutput();
      });

      // Ghost thumb showing where this weight would move after one Learn
      // step (positioned by updateLearnPanel).
      const ghost = document.createElement("div");
      ghost.className = "ghost-thumb";

      column.appendChild(slider);
      column.appendChild(label);
      column.appendChild(ghost);
      ghostThumbs.push(ghost);
      weightsPanel.appendChild(column);
      weightSliders.push(slider);
      sliderColumns.push(column);
      addHoverHighlight(column, i);
    }

    panelObject.appendChild(weightsPanel);
    panelsLayer.appendChild(panelObject);

    // ---------- Initialize / Train buttons ----------
    // A row of buttons centered below the weights panel.
    const BUTTON_GAP = 12;  // vertical gap between weights panel and buttons
    const BUTTON_H   = 40;

    const buttonObject = makeSvg("foreignObject", {
      x: NEURON_X - PANEL_W / 2,
      y: panelTop + PANEL_H + BUTTON_GAP,
      width: PANEL_W,
      height: BUTTON_H,
    });

    const buttonRow = document.createElement("div");
    buttonRow.className = "button-row";

    const initButton = document.createElement("button");
    initButton.type = "button";
    initButton.className = "action-button";
    initButton.textContent = "Initialize";
    initButton.addEventListener("click", initialize);

    // Toggles training on and off (label switches between Train and Pause).
    const trainButton = document.createElement("button");
    trainButton.type = "button";
    trainButton.className = "action-button";
    trainButton.textContent = "Train";
    trainButton.addEventListener("click", toggleTraining);

    // Switches between the training tasks; its label shows the current task.
    // (Placeholder styling: to be refined.)
    const taskButton = document.createElement("button");
    taskButton.type = "button";
    taskButton.className = "action-button";
    taskButton.textContent = TASKS[task].label;
    taskButton.title = "Training task (click to switch)";
    taskButton.addEventListener("click", switchTask);

    buttonRow.appendChild(initButton);
    buttonRow.appendChild(trainButton);
    buttonRow.appendChild(taskButton);
    buttonObject.appendChild(buttonRow);
    panelsLayer.appendChild(buttonObject);

    // ---------- Math panel ----------
    // Two parts, side by side:
    //   left:  the preactivation as column addition: one row per input,
    //            i    x  ×  w  =  x·w
    //          (weights colored like their arrows), then a line and the sum.
    //   right: after a green divider, the selected activation function, its
    //          formula, and its value at the current weighted sum.
    // Its right edge lines up with the output box's right edge, its left edge
    // sits MATH_GAP right of the weights panel, its bottom lines up with the
    // bottom of the Initialize/Train buttons, and its top sits just below the
    // output box.
    const MATH_TOP_GAP = 20;   // vertical gap between output box and math panel
    const MATH_GAP     = 14;   // horizontal gap between weights panel and math panel
    const mathRight  = outputBoxLeft + OUTPUT_BOX_W;
    const mathLeft   = NEURON_X + PANEL_W / 2 + MATH_GAP;
    const mathTop    = NEURON_Y + OUTPUT_BOX_H / 2 + MATH_TOP_GAP;
    const mathBottom = panelTop + PANEL_H + BUTTON_GAP + BUTTON_H;

    const mathObject = makeSvg("foreignObject", {
      x: mathLeft,
      y: mathTop,
      width: mathRight - mathLeft,
      height: mathBottom - mathTop,
    });

    const mathPanel = document.createElement("div");
    mathPanel.className = "math-panel";

    // Preactivation part (left): a CSS grid with six columns (see .math-grid
    // in the CSS): row number, x, "×", w, "=", product.
    const mathGrid = document.createElement("div");
    mathGrid.className = "math-grid";
    mathPanel.appendChild(mathGrid);

    // Activation part (right), one item per line: the function's name, the
    // formula with the weighted sum filled in, "=" (or "≈"), and the result.
    // Contents are set in updateMathPanel, since they depend on the selected
    // activation.
    const activationMath = document.createElement("div");
    activationMath.className = "activation-math";
    const actName    = document.createElement("div");
    const actApplied = document.createElement("div");
    const actEquals  = document.createElement("div");
    const actValue   = document.createElement("div");
    actName.className  = "act-name";
    actValue.className = "act-value";
    activationMath.append(actName, actApplied, actEquals, actValue);
    mathPanel.appendChild(activationMath);

    // Line connecting the weighted sum to the same value inside the activation
    // formula. It's drawn in an SVG laid over the whole panel (see
    // .math-link-overlay); updateMathLink sets its shape.
    const MATH_LINK_GAP        = 6;   // space between the start and the sum
    const MATH_LINK_END_GAP    = 2;   // space between the end and the formula
    const MATH_LINK_RISER      = 16;  // how far right of the divider it rises
    const MATH_LINK_RADIUS     = 20;  // rounding of the two big turns
    const MATH_LINK_END_RADIUS = 4;   // rounding of the short final turn
    const mathLinkOverlay = makeSvg("svg", { class: "math-link-overlay" });
    const mathLinkPath    = makeSvg("path", { class: "math-link" });
    mathLinkOverlay.appendChild(mathLinkPath);
    mathPanel.appendChild(mathLinkOverlay);

    const mathCells = [];  // all six cells of each input's row (for highlighting)
    const mathValues = []; // { x, w, product } value cells per input
    let mathTotalCell;

    // Helper: add one cell to the grid.
    function addMathCell(className, html) {
      const cell = document.createElement("div");
      cell.className = className;
      cell.innerHTML = html;
      mathGrid.appendChild(cell);
      return cell;
    }

    // Header row.
    addMathCell("math-head", "");
    addMathCell("math-head", "<i>x</i>");
    addMathCell("math-head", "");
    addMathCell("math-head", "<i>w</i>");
    addMathCell("math-head", "");
    addMathCell("math-head math-product", "<i>x</i>·<i>w</i>");

    // One row per input square. Hovering any cell highlights the whole row
    // (and the matching pixel, square, arrow and slider).
    for (let i = 0; i < NUM_INPUTS; i++) {
      const row = [
        addMathCell("math-cell math-index", String(i + 1)),
        addMathCell("math-cell", ""),
        addMathCell("math-cell math-op", "×"),
        addMathCell("math-cell", ""),
        addMathCell("math-cell math-op", "="),
        addMathCell("math-cell math-product", ""),
      ];
      for (const cell of row) addHoverHighlight(cell, i);
      mathCells.push(row);
      mathValues.push({ x: row[1], w: row[3], product: row[5] });
    }

    // Sum row: "weighted sum" spanning the first four columns, then "=" in
    // the same column as the rows' "=", then the total.
    const mathSumLabel = addMathCell("math-sum-label", "weighted sum");
    addMathCell("math-sum-op", "=");
    mathTotalCell = addMathCell("math-total", "");

    mathObject.appendChild(mathPanel);
    panelsLayer.appendChild(mathObject);

    // Format a number to a fixed number of decimals, using a true minus sign
    // and avoiding "-0.0" for tiny negative values.
    function formatNumber(v, decimals) {
      let text = v.toFixed(decimals);
      if (Number(text) === 0) text = (0).toFixed(decimals);
      return text.replace("-", "−");
    }

    // Widen the table's gaps so the rows span the same width as the
    // "weighted sum" label below them. --op-gap and --index-gap (set in the
    // CSS) are scaled up by the same factor, so their proportions, the equal
    // spacing around "×" and "=", and the alignment of the "=" signs are all
    // kept. Runs once after the first update (the cells must have content to
    // be measured); all values have constant widths, so it only needs redoing
    // if the font changes (e.g. once a web font finishes loading).
    function fitMathSpacing() {
      // Start from the CSS base gaps, not a previous run's scaled ones.
      mathGrid.style.removeProperty("--op-gap");
      mathGrid.style.removeProperty("--index-gap");

      // Width of a cell's text alone (not the cell, which may be stretched).
      const textWidth = el => {
        const range = document.createRange();
        range.selectNodeContents(el);
        return range.getBoundingClientRect().width;
      };
      const [indexCell, xCell, timesCell, wCell] = mathCells[0];

      // All widths are measured on screen, in screen pixels: the diagram is
      // scaled to fit the window, so CSS pixels are converted using
      // screenPerCss (measured from the "×" cell, whose padding is --op-gap).
      const style   = getComputedStyle(mathGrid);
      const baseOp  = parseFloat(style.getPropertyValue("--op-gap"));
      const baseIdx = parseFloat(style.getPropertyValue("--index-gap"));
      const opGap   = (timesCell.getBoundingClientRect().width - textWidth(timesCell)) / 2;
      const screenPerCss = opGap / baseOp;

      // Columns 1-4 hold: row number, index gap, x, op gap, "×", op gap, w.
      // Find the scale that makes them exactly as wide as the label.
      const label   = textWidth(mathSumLabel);
      const content = textWidth(indexCell) + textWidth(xCell) +
                      textWidth(timesCell) + textWidth(wCell);
      const gaps    = (baseIdx + 2 * baseOp) * screenPerCss;
      const scale   = Math.max(1, (label - content) / gaps);

      if (verbose) console.log(`fitMathSpacing: gaps scaled by ${scale.toFixed(3)}`);

      mathGrid.style.setProperty("--op-gap", `${baseOp * scale}px`);
      mathGrid.style.setProperty("--index-gap", `${baseIdx * scale}px`);
      updateMathLink();  // the layout changed, so redraw the connecting curve
    }

    // Redraw the line from the weighted sum's value to the same value inside
    // the activation formula (the "act-z" span). Its route:
    //   1. right, out of the sum;
    //   2. up, just right of the green divider;
    //   3. right, in the gap between the function name and the formula;
    //   4. a short turn down, ending just above the value in the formula.
    // Called after every math-panel update, since the value's position in
    // the formula changes as the formula's width changes.
    function updateMathLink() {
      const totalValue = mathTotalCell.querySelector(".math-value");
      const formula    = actApplied.firstElementChild;
      const formulaZ   = actApplied.querySelector(".act-z");
      if (!totalValue || !formula || !formulaZ || mathPanel.offsetWidth === 0) return;

      // Screen positions are converted into the panel's own CSS pixels (the
      // overlay's coordinates): the diagram is scaled on screen, and the
      // overlay starts inside the panel's border (clientLeft/clientTop).
      const panelRect = mathPanel.getBoundingClientRect();
      const scale = panelRect.width / mathPanel.offsetWidth;
      const toLocalX = x => (x - panelRect.left) / scale - mathPanel.clientLeft;
      const toLocalY = y => (y - panelRect.top) / scale - mathPanel.clientTop;

      const sum     = totalValue.getBoundingClientRect();
      const name    = actName.getBoundingClientRect();
      const form    = formula.getBoundingClientRect();
      const z       = formulaZ.getBoundingClientRect();
      const divider = activationMath.getBoundingClientRect().left;

      const startX = toLocalX(sum.right) + MATH_LINK_GAP;
      const startY = toLocalY((sum.top + sum.bottom) / 2);
      const riserX = toLocalX(divider) + MATH_LINK_RISER;
      const topY   = toLocalY((name.bottom + form.top) / 2);  // between name and formula
      const endX   = toLocalX((z.left + z.right) / 2);       // above the value's center
      const endY   = toLocalY(z.top) - MATH_LINK_END_GAP;

      // Straight segments joined by rounded corners. Each corner is a
      // quadratic Bezier ("Q") whose control point is the sharp corner, so the
      // line bends smoothly from one direction to the next.
      const r  = MATH_LINK_RADIUS;
      const r2 = MATH_LINK_END_RADIUS;
      mathLinkPath.setAttribute("d", [
        `M ${startX} ${startY}`,
        `H ${riserX - r}`,                                   // 1. right
        `Q ${riserX} ${startY} ${riserX} ${startY - r}`,     //    turn up
        `V ${topY + r}`,                                     // 2. up
        `Q ${riserX} ${topY} ${riserX + r} ${topY}`,         //    turn right
        `H ${endX - r2}`,                                    // 3. right
        `Q ${endX} ${topY} ${endX} ${topY + r2}`,            //    short turn down
        `V ${endY}`,                                         // 4. down
      ].join(" "));
    }

    // Prefix a non-negative number with an invisible minus sign, so positive
    // and negative values are equally wide and line up by decimal point.
    function withSignSlot(text) {
      return text.startsWith("−") ? text : `<span class="math-pad">−</span>${text}`;
    }

    // Follow a number with invisible copies of whatever characters it's
    // missing compared with the widest possible value (e.g. "1.80" vs
    // "−18.00" gets an invisible "−1" after it), so its width never changes
    // but it still starts right where the cell starts. The visible part is
    // wrapped in a "math-value" span so its own edges can be measured.
    function withTrailingPad(text, widest) {
      let missing = "";
      if (!text.startsWith("−")) missing += "−";
      const intDigits = text.replace("−", "").split(".")[0].length;
      const widestDigits = widest.replace("−", "").split(".")[0].length;
      missing += "0".repeat(Math.max(0, widestDigits - intDigits));
      const value = `<span class="math-value">${text}</span>`;
      return missing ? `${value}<span class="math-pad">${missing}</span>` : value;
    }

    // Refresh every value in the math panel from the current inputs and
    // weights. (Rounded products may not add up exactly to the rounded total.)
    function updateMathPanel() {
      for (let i = 0; i < NUM_INPUTS; i++) {
        const x = inputs[INPUT_TO_PIXEL[i]];
        const w = weights[i];
        const cells = mathValues[i];
        cells.x.textContent = x;
        cells.w.innerHTML = withSignSlot(formatNumber(w, 1));
        cells.w.style.color = weightToColor(w);
        cells.product.innerHTML = withSignSlot(formatNumber(x * w, 1));
      }
      const z = computePreactivation();
      mathTotalCell.innerHTML = withTrailingPad(formatNumber(z, 2), "−18.00");

      // Activation part. Sigmoid results use formatProbability, so a value
      // that rounds to 0.00 or 1.00 shows "≈" like the output box does; its
      // "≈ 0.00" / "= 0.05" text is split into the sign and the number.
      const act = ACTIVATIONS.find(a => a.id === activation);
      const y = act.f(z);
      const result = (act.id === "sigmoid") ? formatProbability(y)
                                            : `= ${formatNumber(y, 2)}`;
      const [sign, number] = result.split(" ");
      actName.textContent  = act.label;
      // (Wrapped in a span so the formula's own left edge can be measured.)
      actApplied.innerHTML = `<span>${act.applied(formatNumber(z, 2))}</span>`;
      actEquals.textContent = sign;
      actValue.textContent  = number;

      updateMathLink();
    }

    // ---------- Learning panel ----------
    // Shows how the image on screen would change the weights in one step:
    //   Δw = learning rate × error × x,   error = target − output
    // (the same rule Train uses, but for this one image instead of the
    // average over the training set). The Learn button applies it.
    // Upper right: same left/right edges as the math panel, top aligned with
    // the activation panel, bottom LEARN_BOTTOM_GAP above the output box.
    const LEARN_BOTTOM_GAP = 20;
    const LEARN_RATE_MAX   = 1;     // learning-rate slider runs 0 to this
    const LEARN_RATE_STEP  = 0.01;
    // Assumed size of the browser's slider thumb, used to place the ghost
    // thumbs (the thumb's center travels the slider's length minus this).
    // Browsers don't expose it, so it may need tuning.
    const SLIDER_THUMB = 16;
    const SLIDER_LENGTH = 130;      // matches the slider height in the CSS
    const SLIDER_TOP    = 2;        // matches .slider-column top padding

    const learnTop    = inputColumnTop;
    const learnBottom = NEURON_Y - OUTPUT_BOX_H / 2 - LEARN_BOTTOM_GAP;

    const learnObject = makeSvg("foreignObject", {
      x: mathLeft,
      y: learnTop,
      width: mathRight - mathLeft,
      height: learnBottom - learnTop,
    });

    const learnPanel = document.createElement("div");
    learnPanel.className = "learn-panel";

    // Top part: the per-input table (left) and the side column (right).
    const learnBody = document.createElement("div");
    learnBody.className = "learn-body";
    learnPanel.appendChild(learnBody);

    // Left: one row per input, laid out like the preactivation table:
    //   i   x  ×  (rate × error)  =  Δw
    // Hovering a row highlights that input everywhere.
    const learnGrid = document.createElement("div");
    learnGrid.className = "learn-grid";
    learnBody.appendChild(learnGrid);
    const learnValues = [];  // { x, factor, delta } value cells per input

    function addLearnCell(className, html) {
      const cell = document.createElement("div");
      cell.className = className;
      cell.innerHTML = html;
      learnGrid.appendChild(cell);
      return cell;
    }

    // Header row. "rate × error" spans the "×" column and the column after
    // it (positioned in the CSS).
    addLearnCell("learn-head", "");
    addLearnCell("learn-head learn-x", "<i>x</i>");
    addLearnCell("learn-head learn-factor-head", "rate × error");
    addLearnCell("learn-head", "");
    addLearnCell("learn-head learn-delta", "Δ<i>w</i>");

    for (let i = 0; i < NUM_INPUTS; i++) {
      const row = [
        addLearnCell("learn-index", String(i + 1)),
        addLearnCell("learn-x", ""),
        addLearnCell("learn-op", "×"),
        addLearnCell("", ""),
        addLearnCell("learn-op", "="),
        addLearnCell("learn-delta", ""),
      ];
      for (const cell of row) addHoverHighlight(cell, i);
      learnCells.push(row);
      learnValues.push({ x: row[1], factor: row[3], delta: row[5] });
    }

    // Right: target, learning rate, then the error and rate × error worked
    // out step by step.
    const learnSide = document.createElement("div");
    learnSide.className = "learn-side";
    learnBody.appendChild(learnSide);

    const targetRow = document.createElement("div");
    targetRow.className = "learn-row";
    const targetLabel = document.createElement("span");
    targetLabel.className = "learn-label";
    targetLabel.textContent = "Target";
    targetRow.appendChild(targetLabel);

    // X vs O task: pick whether the image on screen is an X or an O.
    const targetButtons = [];
    for (const [text, value] of [["X", TARGET_X], ["O", TARGET_O]]) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "target-option";
      button.textContent = text;
      button.addEventListener("click", () => {
        xoTarget = value;
        updateLearnPanel();
      });
      targetRow.appendChild(button);
      targetButtons.push({ value, button });
    }
    // Counting task: the target is just the black-pixel count.
    const countTarget = document.createElement("span");
    targetRow.appendChild(countTarget);
    learnSide.appendChild(targetRow);

    const rateRow = document.createElement("div");
    rateRow.className = "learn-row";
    const rateLabel = document.createElement("span");
    rateLabel.className = "learn-label";
    rateLabel.textContent = "Learning rate";
    const rateSlider = document.createElement("input");
    rateSlider.type  = "range";
    rateSlider.className = "learn-rate-slider";
    rateSlider.min   = 0;
    rateSlider.max   = LEARN_RATE_MAX;
    rateSlider.step  = LEARN_RATE_STEP;
    rateSlider.value = learningRate;
    const rateValue = document.createElement("span");
    rateSlider.addEventListener("input", () => {
      learningRate = Number(rateSlider.value);
      updateLearnPanel();
    });
    // Label and value on one line, the slider on its own line below.
    rateRow.append(rateLabel, rateValue);
    learnSide.append(rateRow, rateSlider);

    // Worked calculations; contents set by updateLearnPanel.
    const errorText  = document.createElement("div");
    const factorText = document.createElement("div");
    learnSide.append(errorText, factorText);

    // Bottom row: the rule, in words, and Learn.
    const formulaRow = document.createElement("div");
    formulaRow.className = "learn-row spread";
    const formulaText = document.createElement("div");
    formulaText.innerHTML = "Δ<i>w</i> = learning rate × error × input";
    const learnButton = document.createElement("button");
    learnButton.type = "button";
    learnButton.className = "learn-button";
    learnButton.textContent = "Learn";
    learnButton.addEventListener("click", learnFromImage);
    formulaRow.append(formulaText, learnButton);
    learnPanel.appendChild(formulaRow);

    // Show the ghost thumbs on the weight sliders only while the mouse is
    // over this panel.
    learnPanel.addEventListener("mouseenter", () => weightsPanel.classList.add("show-ghosts"));
    learnPanel.addEventListener("mouseleave", () => weightsPanel.classList.remove("show-ghosts"));

    learnObject.appendChild(learnPanel);
    panelsLayer.appendChild(learnObject);

    // Make the learning panel as wide as the math panel (which sizes itself
    // to its contents) and push it right, so both panels share left and
    // right edges. Widths are CSS pixels inside their foreignObjects, i.e.
    // diagram units.
    function matchLearnWidth() {
      learnPanel.style.width = `${mathPanel.offsetWidth}px`;
      learnPanel.style.marginLeft = "auto";

      // Center both panels' labels on them (they share left/right edges).
      const centerX = mathRight - mathPanel.offsetWidth / 2;
      learnLabel.setAttribute("x", centerX);
      mathLabel.setAttribute("x", centerX);
    }

    // Set the learning rate and move its slider to match.
    function setLearningRate(rate) {
      learningRate = rate;
      rateSlider.value = rate;
    }

    // Target for the image on screen: picked (X vs O) or counted (counting).
    function currentTarget() {
      return (task === "xo") ? xoTarget : inputs.reduce((sum, v) => sum + v, 0);
    }

    // One update for the image on screen, using the selected activation.
    // With ReLU, a preactivation <= 0 means the function is flat, so it passes
    // no gradient and no weight changes (just as in training).
    function computeLearnStep() {
      const z = computePreactivation();
      const act = ACTIVATIONS.find(a => a.id === activation);
      const output = act.f(z);
      const target = currentTarget();
      const error = target - output;
      const flat = (act.id === "relu" && z <= 0);
      const deltas = [];
      for (let i = 0; i < NUM_INPUTS; i++) {
        const x = inputs[INPUT_TO_PIXEL[i]];
        deltas.push(flat ? 0 : learningRate * error * x);
      }
      return { target, output, error, flat, deltas };
    }

    // A weight after adding a change, kept within the slider range.
    function clampWeight(w) {
      return Math.min(W_MAX, Math.max(-W_MAX, w));
    }

    // Color for a change: blue for up, red for down, gray for none.
    function deltaColor(d) {
      const text = formatNumber(d, 2);
      if (Number(text) === 0) return "#9a9a9a";
      return `rgb(${(d > 0 ? POSITIVE_COLOR : NEGATIVE_COLOR).join(", ")})`;
    }

    // Refresh the learning panel and the ghost thumbs. Called from
    // updateOutput, so it follows every change to inputs, weights or task.
    function updateLearnPanel() {
      const { target, output, error, flat, deltas } = computeLearnStep();

      // Target controls for the current task.
      const isXO = (task === "xo");
      for (const { value, button } of targetButtons) {
        button.style.display = isXO ? "" : "none";
        button.classList.toggle("selected", value === xoTarget);
      }
      countTarget.style.display = isXO ? "none" : "";
      countTarget.textContent = `${target} (black pixels)`;
      rateValue.textContent = formatNumber(learningRate, 2);

      // Worked calculations. The error and rate × error are colored by sign
      // (blue = weights on active inputs go up, red = down).
      const factor = flat ? 0 : learningRate * error;
      const errorShown  = formatNumber(error, 2);
      const factorShown = formatNumber(factor, 2);
      errorText.innerHTML =
        `<span class="learn-label">Error</span> = target − output` +
        `<div class="learn-step">= ${target} − ${formatNumber(output, 2)}` +
        ` = <b style="color: ${deltaColor(error)}">${errorShown}</b></div>`;
      factorText.innerHTML = flat
        ? `<span class="learn-label">Rate × error</span> = 0` +
          `<div class="learn-step">(ReLU is flat here)</div>`
        : `<span class="learn-label">Rate × error</span>` +
          `<div class="learn-step">= ${formatNumber(learningRate, 2)} × ${errorShown}` +
          ` = <b style="color: ${deltaColor(factor)}">${factorShown}</b></div>`;

      for (let i = 0; i < NUM_INPUTS; i++) {
        const cells = learnValues[i];
        cells.x.textContent = inputs[INPUT_TO_PIXEL[i]];
        cells.factor.innerHTML = withSignSlot(factorShown);
        cells.factor.style.color = deltaColor(factor);
        cells.delta.innerHTML = withSignSlot(formatNumber(deltas[i], 2));
        cells.delta.style.color = deltaColor(deltas[i]);

        // Ghost thumb at the weight's new value (right over the thumb when
        // the weight wouldn't change).
        const newW = clampWeight(weights[i] + deltas[i]);
        const fromTop = (W_MAX - newW) / (2 * W_MAX);  // 0 at the top, 1 at the bottom
        ghostThumbs[i].style.top =
          `${SLIDER_TOP + SLIDER_THUMB / 2 + fromTop * (SLIDER_LENGTH - SLIDER_THUMB)}px`;
      }

    }

    // Learn button: pause any training, then apply one update for the image
    // on screen.
    function learnFromImage() {
      if (isTraining) toggleTraining();
      const { deltas } = computeLearnStep();
      for (let i = 0; i < NUM_INPUTS; i++) {
        weights[i] = clampWeight(weights[i] + deltas[i]);
        weightSliders[i].value = weights[i];
        updateWeightDisplay(i);
      }
      updateOutput();
    }

    // Set every weight to a random value, uniform between -W_MAX and +W_MAX,
    // rounded to the slider's step. Updates sliders, arrows and output.
    function initializeWeights() {
      for (let i = 0; i < NUM_INPUTS; i++) {
        const raw = (Math.random() * 2 - 1) * W_MAX;
        weights[i] = Math.round(raw / W_STEP) * W_STEP;
        weightSliders[i].value = weights[i];
        updateWeightDisplay(i);
      }
      updateOutput();
    }

    // Initialize button (and page load): pause any training, then new random
    // weights and a fresh training set.
    function initialize() {
      if (isTraining) toggleTraining();  // pauses and resets the button label
      initializeWeights();
      generateTrainingSet();
    }

    // ---------- Training ----------
    // Random number from a standard normal distribution (mean 0, SD 1), using
    // the Box-Muller transform. (1 - Math.random() avoids taking log(0).)
    function randomNormal() {
      const u = 1 - Math.random();
      const v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }

    // A noisy copy of a base image: add Gaussian noise to every pixel, then
    // clip to the range 0-1.
    function makeNoisyImage(base) {
      return base.map(v => Math.min(1, Math.max(0, v + NOISE_SD * randomNormal())));
    }

    // Build the fixed training set for the current task.
    //   xo:    half noisy Xs, half noisy Os.
    //   count: random black/white images, each labeled with its black count.
    function generateTrainingSet() {
      trainingSet = [];
      if (task === "xo") {
        for (let n = 0; n < TRAIN_SET_SIZE / 2; n++) {
          trainingSet.push({ pixels: makeNoisyImage(BASE_X), target: TARGET_X });
          trainingSet.push({ pixels: makeNoisyImage(BASE_O), target: TARGET_O });
        }
      } else {
        for (let n = 0; n < TRAIN_SET_SIZE; n++) {
          const pixels = Array.from({ length: NUM_INPUTS },
                                    () => (Math.random() < COUNT_BLACK_PROB ? 1 : 0));
          const target = pixels.reduce((sum, v) => sum + v, 0);
          trainingSet.push({ pixels, target });
        }
      }
    }

    // One step of full-batch gradient descent for the current task. Both
    // pairings give the same simple update: each weight moves by
    //   learning rate x average over images of (target - output) x pixel,
    // except that with ReLU an image whose preactivation is <= 0 contributes
    // nothing (ReLU is flat there, so it passes no gradient).
    //   xo:    sigmoid + cross-entropy loss.
    //   count: ReLU + squared-error loss (1/2 x (output - target)^2).
    // Weights are clamped to the slider range afterward.
    function trainStep() {
      const actId = TASKS[task].activation;
      const f = ACTIVATIONS.find(a => a.id === actId).f;
      const step = new Array(NUM_INPUTS).fill(0);
      let loss = 0;

      for (const { pixels, target } of trainingSet) {
        const z = computePreactivation(pixels);
        const output = f(z);
        let error = target - output;
        if (actId === "relu" && z <= 0) error = 0;
        for (let p = 0; p < NUM_INPUTS; p++) {
          step[PIXEL_TO_INPUT[p]] += error * pixels[p];
        }
        if (verbose) {
          if (actId === "sigmoid") {
            // Cross-entropy loss; the tiny constant avoids log(0).
            loss -= target * Math.log(output + 1e-12) +
                    (1 - target) * Math.log(1 - output + 1e-12);
          } else {
            loss += 0.5 * (output - target) ** 2;
          }
        }
      }

      for (let i = 0; i < NUM_INPUTS; i++) {
        const updated = weights[i] + learningRate * step[i] / trainingSet.length;
        weights[i] = Math.min(W_MAX, Math.max(-W_MAX, updated));
        weightSliders[i].value = weights[i];
        updateWeightDisplay(i);
      }
      updateOutput();

      trainStepCount++;
      if (verbose && trainStepCount % 60 === 0) {
        console.log(`step ${trainStepCount}: mean loss ${(loss / trainingSet.length).toFixed(4)}`,
                    weights.map(w => w.toFixed(2)).join(" "));
      }
    }

    // Animation loop: one training step per frame while training is on.
    function trainLoop() {
      if (!isTraining) return;
      trainStep();
      requestAnimationFrame(trainLoop);
    }

    // Train/Pause button. Starting training switches to the current task's
    // activation (sigmoid for X vs O, ReLU for counting).
    function toggleTraining() {
      isTraining = !isTraining;
      trainButton.textContent = isTraining ? "Pause" : "Train";
      if (isTraining) {
        activation = TASKS[task].activation;
        updateActivationSelection();
        updateOutput();
        requestAnimationFrame(trainLoop);
      }
    }

    // Task button: pause training, switch to the other task, build that
    // task's training set, and select its activation and default learning
    // rate. Weights are kept.
    function switchTask() {
      if (isTraining) toggleTraining();
      task = (task === "xo") ? "count" : "xo";
      taskButton.textContent = TASKS[task].label;
      generateTrainingSet();
      setLearningRate(TASKS[task].learningRate);
      activation = TASKS[task].activation;
      updateActivationSelection();
      updateOutput();
    }

    // ---------- Activation panel ----------
    // Same size as the weights panel, centered above the neuron. Holds one
    // clickable plot per activation function; the selected one is outlined.
    // Top aligned with the top of the first input square.
    const activationPanelTop = inputColumnTop;

    const activationObject = makeSvg("foreignObject", {
      x: NEURON_X - PANEL_W / 2,
      y: activationPanelTop,
      width: PANEL_W,
      height: PANEL_H,
    });

    const activationPanel = document.createElement("div");
    activationPanel.className = "control-panel activation-panel";
